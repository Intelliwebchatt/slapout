# Netlify configuration for The Ryder McCoy Band site

# Old Glass Rose URL compatibility.
[[redirects]]
  from = "/glass-rose-sessions.html"
  to = "/glass-rose.html"
  status = 301
  force = true

# Temporary compatibility fixer for the homepage only.
# Keeps two legacy MP3 references working until the source HTML is cleaned directly.
[[edge_functions]]
  path = "/"
  function = "darken-story"
