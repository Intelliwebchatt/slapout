name: Temporary jump height tune

on:
  push:
    branches:
      - cursor/slapout-after-midnight-b696
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: cursor/slapout-after-midnight-b696
          fetch-depth: 0

      - name: Increase jump height with controlled margin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('slapout-after-midnight.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '  JUMP_V: -440,': '  JUMP_V: -480,',
              '  RYDER: { accel: 620, maxRun: 160, jump: -440, hWalk: 22, hRisen: 26 },': '  RYDER: { accel: 620, maxRun: 160, jump: -480, hWalk: 22, hRisen: 26 },',
              '  UNC:   { accel: 480, maxRun: 150, jump: -460, hWalk: 22, hRisen: 26 },': '  UNC:   { accel: 480, maxRun: 150, jump: -500, hWalk: 22, hRisen: 26 },',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate script and changed values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('slapout-after-midnight.html').read_text(encoding='utf-8')
          match = re.search(r'<script>([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit('Game script block not found')
          Path('/tmp/slapout-after-midnight.js').write_text(match.group(1), encoding='utf-8')

          required = [
              'JUMP_V: -480',
              'RYDER: { accel: 620, maxRun: 160, jump: -480',
              'UNC:   { accel: 480, maxRun: 150, jump: -500',
          ]
          for value in required:
              if value not in html:
                  raise SystemExit(f'Missing expected value: {value}')
          PY
          node --check /tmp/slapout-after-midnight.js
          git diff --check

      - name: Commit tune and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-jump-height-tune.yml
          git add slapout-after-midnight.html
          git commit -m 'Increase jump height for upper platforms'
          git push origin HEAD:cursor/slapout-after-midnight-b696
