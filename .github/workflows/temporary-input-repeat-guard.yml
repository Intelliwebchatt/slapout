name: Temporary input repeat guard

on:
  push:
    branches:
      - cursor/slapout-after-midnight-b696
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: cursor/slapout-after-midnight-b696
          fetch-depth: 0

      - name: Apply exact repeated-key guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("slapout-after-midnight.html")
          text = path.read_text(encoding="utf-8")

          old = '''addEventListener("keydown", e => {
            usingTouch = false; showPads(false);
            if (["ArrowLeft", "KeyA"].includes(e.code)) key.l = true;
            if (["ArrowRight", "KeyD"].includes(e.code)) key.r = true;
            if (["Space", "ArrowUp", "KeyW"].includes(e.code)) { key.j = true; e.preventDefault(); }
            if (["KeyX", "ShiftLeft", "ShiftRight"].includes(e.code)) key.x = true;
            if (e.code === "KeyM" && !e.repeat) { ensureAC(); setMute(!audioOn); }
            handleScreenKey(e);
          });'''

          new = '''addEventListener("keydown", e => {
            usingTouch = false;
            showPads(false);

            if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
              e.preventDefault();
            }

            if (!e.repeat) {
              if (["ArrowLeft", "KeyA"].includes(e.code)) key.l = true;
              if (["ArrowRight", "KeyD"].includes(e.code)) key.r = true;
              if (["Space", "ArrowUp", "KeyW"].includes(e.code)) key.j = true;
              if (["KeyX", "ShiftLeft", "ShiftRight"].includes(e.code)) key.x = true;
            }

            if (e.code === "KeyM" && !e.repeat) {
              ensureAC();
              setMute(!audioOn);
            }

            handleScreenKey(e);
          });'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected one keydown block, found {count}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("slapout-after-midnight.html").read_text(encoding="utf-8")
          match = re.search(r"<script>([\s\S]*?)</script>", html)
          if not match:
              raise SystemExit("Game script block not found")
          Path("/tmp/slapout-after-midnight.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/slapout-after-midnight.js
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-input-repeat-guard.yml
          git add slapout-after-midnight.html
          git commit -m "Guard gameplay input from repeated keydown events"
          git push origin HEAD:cursor/slapout-after-midnight-b696
