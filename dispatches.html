<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backroad Dispatches — The Ryder McCoy Band</title><meta name="description" content="Backroad Dispatches. Notes from the dirt road."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&display=swap" rel="stylesheet"><style>:root{--asphalt:#0b0a08;--smoke:#171310;--panel:#1d1813;--neon:#ff8a2a;--hot:#ffc27a;--bone:#e9e0cf;--ash:#9a8f7e;--line:#2c241c}*{box-sizing:border-box;margin:0;padding:0}body{background:radial-gradient(circle at 12% 0,rgba(163,31,31,.18),transparent 35%),linear-gradient(#0b0a08,#080706);color:var(--bone);font:17px/1.6 Georgia,serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.055;mix-blend-mode:screen;background-image:radial-gradient(circle at 20% 30%,rgba(255,138,42,.18) 0 1px,transparent 1px),radial-gradient(circle at 80% 70%,rgba(255,255,255,.12) 0 1px,transparent 1px);background-size:34px 34px,47px 47px}.wrap{width:min(1060px,100%);margin:auto;padding:0 20px}.display{font-family:Anton,sans-serif;text-transform:uppercase;letter-spacing:.045em;font-weight:400}.type{font-family:'Special Elite',monospace}.top{position:sticky;top:0;z-index:20;background:rgba(11,10,8,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 20px}.brand,.nav a{font-family:'Special Elite',monospace;text-transform:uppercase;text-decoration:none}.brand{color:var(--bone);letter-spacing:.17em;font-size:.75rem}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.nav a{color:var(--ash);letter-spacing:.13em;font-size:.66rem;border:1px solid var(--line);padding:7px 9px;background:rgba(23,19,16,.7)}.hero{padding:74px 0 44px;border-bottom:1px solid var(--line)}h1{font-size:clamp(2.7rem,10vw,6rem);line-height:.95}.hero .tag{margin-top:18px;font-family:'Special Elite',monospace;color:var(--hot);font-size:.92rem;letter-spacing:.16em;text-transform:uppercase}.filters{background:var(--smoke);border-bottom:1px solid var(--line)}.filters .wrap{display:flex;gap:10px;overflow:auto;padding-top:16px;padding-bottom:16px}.filter{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ash);font-family:'Special Elite',monospace;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem;padding:9px 12px}.filter.active,.filter:hover{color:var(--hot);border-color:rgba(255,138,42,.55);background:rgba(255,138,42,.07)}.feed{padding:48px 0 84px}.grid{display:grid;gap:22px}@media(min-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.card.wide{grid-column:1/-1}.card.photo.wide{display:grid;grid-template-columns:.9fr 1.1fr}.card.photo.wide .media{border-bottom:0;border-right:1px solid var(--line)}}.card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,rgba(29,24,19,.97),rgba(10,9,8,.99));box-shadow:0 26px 58px rgba(0,0,0,.46)}.media{min-height:210px;background:radial-gradient(circle at 38% 25%,rgba(255,138,42,.14),transparent 38%),linear-gradient(#16110d,#090807);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}.media img{width:100%;height:100%;min-height:210px;object-fit:cover;filter:brightness(.78) contrast(1.08) saturate(.82)}.media span{font-family:'Special Elite',monospace;text-transform:uppercase;letter-spacing:.18em;color:rgba(233,224,207,.45);font-size:.7rem;border:1px dashed rgba(255,138,42,.3);padding:12px 14px}.body{padding:22px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.stamp{font-family:'Special Elite',monospace;color:var(--hot);border:1px solid rgba(255,138,42,.36);padding:4px 7px;text-transform:uppercase;letter-spacing:.14em;font-size:.62rem}.date{margin-left:auto;font-family:'Special Elite',monospace;color:var(--ash);font-size:.7rem}.card h2{font-size:clamp(1.45rem,4vw,2.1rem);line-height:1.04;margin-bottom:11px}.by{font-family:'Special Elite',monospace;color:var(--ash);text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-bottom:16px}.copy p{margin-bottom:13px;color:rgba(233,224,207,.88)}.snippet{font-family:'Special Elite',monospace;color:var(--hot);background:rgba(0,0,0,.18);border-left:3px solid rgba(255,138,42,.5);padding:12px 13px}.audio{margin-top:14px;border:1px solid var(--line);background:rgba(0,0,0,.22);padding:12px}.audio audio{width:100%}.tags{border-top:1px dashed var(--line);margin-top:17px;padding-top:12px;display:flex;gap:7px;flex-wrap:wrap}.tagchip{font-family:'Special Elite',monospace;color:var(--ash);border:1px solid var(--line);padding:4px 7px;text-transform:uppercase;letter-spacing:.12em;font-size:.6rem}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:38px 22px;text-align:center;color:var(--ash);font-family:'Special Elite',monospace;text-transform:uppercase;letter-spacing:.16em;background:rgba(23,19,16,.45)}footer{border-top:1px solid var(--line);text-align:center;color:var(--ash);padding:38px 20px 60px;font-size:.86rem}.mark{font-family:'Special Elite',monospace;text-transform:uppercase;letter-spacing:.2em;color:var(--bone);margin-bottom:8px}</style></head><body><header class="top"><div class="wrap"><a class="brand" href="/">The Ryder McCoy Band</a><nav class="nav"><a href="/">Album</a><a href="#dispatches">Dispatches</a><a href="/#booking">Contact</a></nav></div></header><main><section class="hero"><div class="wrap"><h1 class="display">Backroad Dispatches</h1><p class="tag">Notes from the Dirt Road</p></div></section><section class="filters"><div class="wrap"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="photo">Images</button><button class="filter" data-filter="song">Song Snippets</button><button class="filter" data-filter="thought">Thoughts</button><button class="filter" data-filter="ryder">Ryder</button><button class="filter" data-filter="jessie">Jessie</button><button class="filter" data-filter="unc">Unc</button><button class="filter" data-filter="label">Biloxi Blues</button></div></section><section class="feed" id="dispatches"><div class="wrap"><div class="grid" id="grid"></div></div></section></main><footer><p class="mark">Biloxi Blues Records</p><p>The Ryder McCoy Band &bull; Slapout, Alabama</p></footer><script>const POSTS=[];const grid=document.getElementById('grid');function card(p){const media=p.image?`<div class="media"><img src="${p.image}" alt="${p.title}"></div>`:`<div class="media"><span>${p.kind}</span></div>`;const copy=(p.body||[]).map(x=>`<p>${x}</p>`).join('');const snippet=p.snippet?`<p class="snippet">${p.snippet}</p>`:'';const audio=p.audio?`<div class="audio"><audio controls preload="metadata" src="${p.audio}"></audio></div>`:'';return `<article class="card ${p.image?'photo':''} ${p.wide?'wide':''}" data-filters="${p.filters.join(' ')} ${p.who.toLowerCase()}">${media}<div class="body"><div class="meta"><span class="stamp">${p.kind}</span><span class="date">${p.date}</span></div><h2 class="display">${p.title}</h2><p class="by">${p.who}</p><div class="copy">${snippet}${copy}${audio}</div><div class="tags">${(p.tags||[]).map(t=>`<span class="tagchip">${t}</span>`).join('')}</div></div></article>`}function render(f='all'){const items=POSTS.filter(p=>f==='all'||p.filters.includes(f)||p.who.toLowerCase().includes(f));grid.innerHTML=items.length?items.map(card).join(''):'<div class="empty">No dispatches filed yet.</div>'}document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));render();</script></body></html>
